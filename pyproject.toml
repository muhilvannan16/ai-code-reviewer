[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-code-reviewer"
version = "0.1.0"
description = "AI-powered code review tool that reviews staged git changes using Groq"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "groq",
    "python-dotenv",
    "rich",
]

[project.scripts]
ai-review = "reviewer.cli:main"

[tool.setuptools.packages.find]
include = ["reviewer*"]
